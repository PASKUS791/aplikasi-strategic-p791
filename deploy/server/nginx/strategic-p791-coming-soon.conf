server {
    listen 127.0.0.1:8787;
    server_name strategic.paskus791.cloud;

    root /var/www/strategic-p791-coming-soon;
    index index.html;

    access_log /var/log/nginx/strategic-p791-coming-soon.access.log;
    error_log /var/log/nginx/strategic-p791-coming-soon.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /data/app-status.json {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}

